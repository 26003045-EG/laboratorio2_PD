name: novamercado-lab2
services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${NOVA_DB_PASSWORD}
    volumes:
      - nova_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      retries: 25

  airflow-db:
    image: postgres:16.8
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 25

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports: ["5000:5000"]
    volumes:
      - mlflow_state:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      retries: 20

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    volumes: &airflow_mounts
      - ./:/project:ro
      - ./dags:/opt/airflow/dags:ro
      - ./shared:/shared
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --role Admin --username $${AIRFLOW_USER_NAME:-admin} --password $${AIRFLOW_USER_PASS:-admin} --firstname Lab --lastname Nova --email lab@localhost.invalid || true"
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql+psycopg2://nova:${NOVA_DB_PASSWORD}@db:5432/nova
      DATA_DIR: /project/data/entrada
      PYTHONPATH: /project
      AIRFLOW_USER_NAME: ${AIRFLOW_USER_NAME}
      AIRFLOW_USER_PASS: ${AIRFLOW_USER_PASS}

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports: ["8080:8080"]
    environment: *airflow_env
    volumes: *airflow_mounts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      retries: 30

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_mounts

  bootstrap:
    build: .
    command: python -m training.train bootstrap
    environment: &api_env
      DATABASE_URL: postgresql+psycopg2://nova:${NOVA_DB_PASSWORD}@db:5432/nova
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: NovaMercadoVentas
      DATA_DIR: /project/data/entrada
    volumes:
      - ./data/entrada:/project/data/entrada:ro
      - ./shared:/shared
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      <<: *api_env
      AIRFLOW_URL: http://airflow-webserver:8080
      AIRFLOW_USER: ${AIRFLOW_USER_NAME}
      AIRFLOW_PASSWORD: ${AIRFLOW_USER_PASS}
    volumes:
      - ./data/entrada:/project/data/entrada:ro
      - ./shared:/shared
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nova_pg:
  airflow_pg:
  mlflow_state:
