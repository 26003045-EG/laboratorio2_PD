name: Pruebas
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TEST_DATABASE_URL: postgresql+psycopg2://pruebas:pruebas@localhost:5432/pruebas
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_DB: pruebas
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q app training scripts dags
      - run: python scripts/preparar_env.py
      - run: docker compose config --quiet
